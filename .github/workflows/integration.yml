name: Integration Tests (Docker Compose)

on:
  pull_request:
    branches: [ main, prod-hardening ]
  workflow_dispatch: {}

jobs:
  compose-up-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with docker-compose
        run: |
          docker compose -f docker-compose.new.yml up -d --build

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend /api/health..."
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/health >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"; docker compose -f docker-compose.new.yml ps; exit 1

      - name: Run smoke tests
        run: |
          set -e
          echo "Checking /api/health"
          curl -fsS http://localhost:8000/api/health
          echo "Checking /metrics"
          curl -fsS http://localhost:8000/metrics || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.new.yml down -v
