name: rl-cleanse-iot-stream
version: "2.0.0"
description: >
  An online sensor-stream denoising environment. The agent steps through a
  contiguous window of real IoT telemetry one reading at a time, choosing a
  corrective action from the current packet plus a rolling buffer of the values
  it has already emitted. It receives no future samples and no reference signal.

author: AnubhavKiroula
license: MIT

dataset:
  name: UCI Air Quality
  reference: "De Vito et al., 2008"
  instances: 9357
  channel: "CO(GT)"
  split: chronological (no shuffling)

tasks:
  - id: iot_stream
    name: IoT Sensor-Stream Denoising
    difficulty: streaming
    description: >
      Denoise a sequential UCI Air Quality sensor stream online under injected
      spikes, calibration drift, transmission dropouts and duplicate packets.
    parameters:
      window_size: 24
      history_len: 5
      corruption_type: [spike, drift, dropout, duplicate, mixed, none]
      split: [train, val, test]

action_space:
  type: discrete
  size: 6
  actions:
    - skip
    - remove_outlier
    - fill_missing
    - fix_type
    - remove_duplicate
    - fix_category

observation_space:
  current_row: int
  total_rows: int
  current_data: object      # {id, timestep, sensor, value} only
  rolling_history: list     # last N values the agent emitted
  rolling_stats: object     # {mean, std, median}
  issues_detected: list     # heuristic flags, not generator labels
  legal_actions: list
  progress: float
  reward: float
  done: bool

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state
  health: GET /health
