name: Research ML CI

on:
  push:
    branches: [main, "feat/**", "Phase-*"]
  pull_request:
    branches: [main]

jobs:
  test-ml-pipeline:
    name: ML core & streaming environment (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the runner has no GPU, and the pipeline must not need one.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run ML unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: |
          pytest -v --durations=10 \
            tests/test_data_loader.py \
            tests/test_iot_env.py \
            tests/test_dqn_training.py

      - name: Validate demo notebook executes headlessly
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
          RL_CLEANSE_CI: "1"
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            RL-Cleanse_demo.ipynb

      - name: Upload executed notebook and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-and-plots
          path: |
            RL-Cleanse_demo.ipynb
            plots/
          if-no-files-found: warn
