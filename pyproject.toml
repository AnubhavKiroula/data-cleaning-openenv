[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-cleanse"
version = "2.0.0"
description = "Reinforcement learning for online denoising of noisy IoT sensor streams"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AnubhavKiroula" }]
keywords = [
    "reinforcement-learning",
    "openenv",
    "iot",
    "sensor-denoising",
    "time-series",
    "dqn",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Notebook execution and the test suite.
dev = [
    "pytest>=7.4",
    "jupyter",
    "nbconvert",
    "nbformat",
    "ipykernel",
]
# The OpenEnv HTTP surface (envs/data_cleaning_env/server/app.py). Not needed
# for training, evaluation, the tests or the notebook.
serve = ["fastapi", "uvicorn", "pydantic", "requests"]

[project.urls]
Repository = "https://github.com/AnubhavKiroula/data-cleaning-openenv"

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "backend.ml*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the research suite green regardless of the legacy test files still
# present in tests/; those target the removed web stack.
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
