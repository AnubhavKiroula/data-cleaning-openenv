name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync repo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if uvx hf upload \
              "01ammu/data-cleaning-openenv" \
              "." \
              --repo-type "space" \
              --exclude=".git*" \
              --exclude=".github*" \
              --delete="*" \
              --commit-message="Sync from GitHub via GitHub Actions"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Upload failed (attempt $attempt/3). Retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Failed to sync to Hugging Face after 3 attempts."
          exit 1
