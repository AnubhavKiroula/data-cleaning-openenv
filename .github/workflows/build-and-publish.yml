name: Build and Publish Docker images

on:
  push:
    branches: [ prod-hardening, main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and push container images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@main
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-backend:latest

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@main
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-frontend:latest

      - name: Create PR comment with image refs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Built images:\n- ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-backend:${{ github.sha }}\n- ghcr.io/${{ github.repository_owner }}/data-cleaning-openenv-frontend:${{ github.sha }}`
            })
