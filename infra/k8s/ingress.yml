apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-cleaning-ingress
  namespace: data-cleaning
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # TLS can be configured with cert-manager; leave placeholders
  tls:
    - hosts:
        - example.com
      secretName: tls-secret
